name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a failed or superseded deploy be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes, but an in-flight one is
# allowed to finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A regression suite that only runs locally protects nothing, so the
      # deploy gates on it too.
      - run: npm test

      # `npm run build` is `tsc -b && vite build`, so a type error fails the
      # deploy instead of shipping a broken page.
      - run: npm run build

      # `enablement: true` turns Pages on if it is not already, so a fresh clone
      # or a re-created repo deploys without a manual settings step. Without it,
      # the very first push races repo creation and fails with "Get Pages site
      # failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
